<!-- Advertiser campaign form (submit -> admin approval -> payment). Plain fieldsets: every field is in the markup. -->
<template id="tpl-advertise-v2">
  <section class="adv">
    <h1 class="page-title">Advertise on Campus Sticky Wall</h1>
    <p class="page-lead">Describe your offer, pick a package and submit. We review it first; <strong>you only pay after approval</strong>. Your ad then goes live and ends automatically. Paid placements are always labelled “Sponsored”.</p>
    <div class="composer__layout">
      <form class="card adv-form" data-ref="form" novalidate>
        <fieldset class="adv-group">
          <legend>1. Your business</legend>
          <label class="field"><span class="field__label">Advertiser / business name</span><input name="advertiser_name" maxlength="80" required autocomplete="organization"></label>
          <label class="field"><span class="field__label">Contact email</span><input name="contact_email" type="email" maxlength="200" required autocomplete="email"></label>
        </fieldset>

        <fieldset class="adv-group">
          <legend>2. Your ad</legend>
          <label class="field"><span class="field__label">Title</span><input name="title" maxlength="80" required></label>
          <label class="field">
            <span class="field__label">Description</span>
            <textarea name="description" maxlength="500" rows="4" required></textarea>
            <span class="field__hint"><span data-ref="descCount">0</span>/500</span>
          </label>
          <label class="field">
            <span class="field__label">Category</span>
            <select name="category" required>
              <option value="student_discount">Student discount</option>
              <option value="local_business">Local business</option>
              <option value="campus_event">Campus event</option>
              <option value="workshop">Workshop</option>
              <option value="competition">Competition</option>
              <option value="recruitment">Internship / recruitment</option>
              <option value="student_service">Student service</option>
              <option value="club_event">Club / organisation event</option>
              <option value="other">Other</option>
            </select>
          </label>
          <details class="small guidelines" open>
            <summary><strong>Ad guidelines</strong> (every ad is reviewed before it goes live)</summary>
            <ul>
              <li>Say clearly what you offer, to whom, and until when. Keep the title short; no ALL CAPS or misleading claims.</li>
              <li>Image: PNG, JPG or WebP up to 1 MB, text readable on a phone. Only images you have the right to use.</li>
              <li>The link must be https:// and go to the thing you advertise. No adult, gambling, illegal or guaranteed-return content.</li>
              <li>Ads that break these rules are rejected with a reason, and you can fix and resubmit for free.</li>
            </ul>
          </details>
          <label class="field"><span class="field__label">Destination link (optional)</span><input name="destination_url" type="url" placeholder="https://" inputmode="url"><span class="field__hint">Leave empty to promote with text only.</span></label>
          <label class="field">
            <span class="field__label">Image (optional)</span>
            <input name="creative" type="file" accept="image/png,image/jpeg,image/webp" data-ref="creative">
            <div class="file-previews" data-ref="creativePreview" aria-live="polite"></div>
            <span class="field__hint">PNG, JPG or WebP, up to 1 MB.</span>
          </label>
        </fieldset>

        <fieldset class="adv-group">
          <legend>3. Package</legend>
          <label class="field">
            <span class="field__label">Placement</span>
            <select data-ref="placement"></select>
            <span class="field__hint" data-ref="placementHint"></span>
          </label>
          <label class="field"><span class="field__label">Duration</span><select data-ref="duration"></select></label>
          <label class="field"><span class="field__label">Where it appears</span><select data-ref="scope"></select></label>
          <div class="field" data-ref="targets"></div>
          <label class="field"><span class="field__label">Preferred start date</span><input name="requested_start" type="date" data-ref="start" required></label>
          <label class="field" data-ref="slotField" hidden>
            <span class="field__label">Slot type</span>
            <select name="slot_type" data-ref="slotType"><option value="standard">Standard</option><option value="top">Top slot (shown first)</option></select>
            <span class="field__hint" data-ref="slotHint"></span>
          </label>
        </fieldset>

        <label class="check"><input type="checkbox" data-ref="agree"><span>I have read the advertising policy and confirm my ad follows it.</span></label>
        <p class="field__error" data-ref="error" role="alert"></p>
        <button type="submit" class="btn btn--primary" data-ref="submit" disabled>Submit for review</button>
        <p class="small muted">Submitting is free. No payment is taken until an administrator approves your ad.</p>
      </form>

      <aside class="composer__side adv-side">
        <div class="card summary" aria-live="polite">
          <h2 class="summary__title">Price summary</h2>
          <dl class="summary__list">
            <div><dt>Placement</dt><dd data-ref="sumPlacement">—</dd></div>
            <div><dt>Duration</dt><dd data-ref="sumDuration">—</dd></div>
            <div><dt>Locations</dt><dd data-ref="sumTargets">0</dd></div>
            <div><dt>Starts</dt><dd data-ref="sumStart">—</dd></div>
            <div class="summary__total"><dt>Total</dt><dd><s class="price-was" data-ref="sumList" hidden></s><span data-ref="sumTotal">Rp0</span></dd></div>
          </dl>
          <p data-ref="sumBadge" hidden><span class="badge badge--founding">Founding advertiser rate</span></p>
          <p class="adv-trust" data-ref="trust" aria-live="polite"></p>
          <ul class="adv-avail small" data-ref="avail" aria-live="polite"></ul>
          <p class="muted small">Prices are set by our server and fixed when you submit.</p>
        </div>
        <div class="card">
          <h2 class="summary__title">How it works</h2>
          <ol class="steps">
            <li>Submit your ad (free).</li>
            <li>We review it, usually within one working day.</li>
            <li>If approved, pay securely with Midtrans.</li>
            <li>Your ad goes live on your start date.</li>
            <li>It ends automatically after your chosen duration.</li>
          </ol>
        </div>
        <section class="card" data-ref="auctionBox" hidden>
          <h2 class="summary__title">Live auctions</h2>
          <p class="small muted">Sold-out featured slots can be won for the next period. Bid with one of your approved ads. You only pay if you win, within 24 hours of the result.</p>
          <p class="notice" data-ref="offerBanner" hidden></p>
          <div class="auction-list" data-ref="auctionList"></div>
        </section>
        <details class="card small" data-ref="waitlistBox">
          <summary><strong>Sold out or not listed? Notify me</strong></summary>
          <form class="waitlist-form" data-ref="waitlistForm" novalidate>
            <p class="muted">Tell us what you want. We will email you when it opens. No payment, no spam.</p>
            <label class="field"><span class="field__label">Email</span><input name="email" type="email" maxlength="200" required autocomplete="email"></label>
            <label class="field"><span class="field__label">Placement</span><select name="spot"><option value="featured">Featured Placement</option><option value="random">Random Placement</option></select></label>
            <label class="field"><span class="field__label">Where</span><select name="scope"><option value="campus">Campus</option><option value="city">City</option><option value="region">Province / region</option><option value="country">Nationwide</option><option value="global">Everywhere</option></select></label>
            <label class="field"><span class="field__label">Duration (days)</span><select name="duration" data-ref="waitDuration"></select></label>
            <label class="field"><span class="field__label">Maximum budget (Rp, optional)</span><input name="max_budget" type="number" min="1" step="1000" inputmode="numeric" placeholder="No limit"></label>
            <p class="field__error" data-ref="waitError" role="alert"></p>
            <button type="submit" class="btn btn--small" data-ref="waitSubmit">Notify me</button>
          </form>
        </details>
        <div class="card" data-ref="whatsapp" hidden>
          <h2 class="summary__title">Custom package or questions?</h2>
          <p class="small">Want a longer run, several campuses or something special? Chat with us — completely optional.</p>
          <a class="btn btn--small" data-ref="whatsappLink" target="_blank" rel="noopener noreferrer">Chat on WhatsApp</a>
        </div>
        <details class="card small">
          <summary><strong>Advertising policy, cancellation &amp; refunds</strong></summary>
          <div class="stack">
            <p><strong>Allowed:</strong> honest offers, events and opportunities that are useful to students.</p>
            <p><strong>Not allowed:</strong> misleading or false claims, adult content, gambling, illegal goods or services, loans/investment schemes with guaranteed returns, harassment or hate, and anything that collects sensitive personal data without clear need.</p>
            <p><strong>Review:</strong> we may reject an ad that breaks these rules. You will see the reason under “Your campaigns” and can submit a corrected ad. Nothing is charged for a rejected ad.</p>
            <p><strong>Cancelling:</strong> before approval or before paying, cancel for free. After payment, cancel for a full refund up to 24 hours before your start; inside 24 hours there is no cancellation or refund (the Pay button shows your exact cut-off). Each account can have 2 refunded cancellations per 30 days; further ones are reviewed manually. Once an ad has started, it is not refundable unless we stop it for a reason that is not your fault.</p>
            <p><strong>Refund abuse:</strong> booking ads and cancelling repeatedly, disputing valid payments or chargebacks may lead to refused refunds and refused future bookings. Refunds are reviewed manually, so email crrptddev@gmail.com if something went wrong.</p>
            <p><strong>Removed ads:</strong> if we remove a live ad for breaking the rules, no refund is due.</p>
            <p><strong>Unreviewed ads:</strong> an ad we haven’t reviewed within 7 days, or whose requested start date has passed, expires; submit it again. Ads are never approved automatically.</p>
            <p><strong>Unpaid approvals:</strong> an approved ad that is not paid within the payment window expires; submit it again if you still want it. If your chosen start date passes before you pay, you can pick a new start date while the ad is still approved.</p>
            <p><strong>Labelling:</strong> every paid ad is shown with a “Sponsored” label.</p>
            <p><strong>Refunds</strong> are returned through the original Midtrans payment method. E-wallet and QRIS payments are refunded instantly, and within 1x24 hours at the latest; bank transfer and convenience store payments are reviewed manually first.</p>
          </div>
        </details>
        <div class="card">
          <h2 class="summary__title">Your campaigns</h2>
          <div data-ref="locks"></div>
          <ul class="campaign-list" data-ref="mine"><li class="muted">Loading…</li></ul>
        </div>
      </aside>
    </div>
  </section>
</template>
