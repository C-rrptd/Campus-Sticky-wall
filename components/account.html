<!-- Account dashboard: notes, bookmarks, payments, shortcuts. -->
<template id="tpl-account">
  <section class="account-view">
    <h1 class="page-title">Hi, <span data-ref="name">there</span></h1>
    <nav class="subnav" aria-label="Account">
      <a href="#/account">Dashboard</a>
      <a href="#/profile">Profile</a>
      <a href="#/referrals">Referrals</a>
      <a href="#/advertise">My campaigns</a>
    </nav>
    <div class="grid-2">
      <div class="card">
        <h2>My notes</h2>
        <ul class="plain-list" data-ref="notes"><li class="muted">Loading…</li></ul>
      </div>
      <div class="card">
        <h2>Bookmarks</h2>
        <div class="mini-wall" data-ref="bookmarks"><p class="muted">Loading…</p></div>
      </div>
      <div class="card card--wide">
        <h2>Payment history</h2>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Date</th><th>Order</th><th>Type</th><th>Total</th><th>Status</th></tr></thead>
            <tbody data-ref="payments"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</template>
