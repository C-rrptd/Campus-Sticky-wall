<!-- Compose a sticky note with a customer-chosen price. Minimum, cap and presets come from site_config (see notes.js). -->
<template id="tpl-note-composer">
  <section class="composer">
    <h1 class="page-title">Post a sticky note</h1>
    <p class="page-lead">No account needed. <strong>You choose how much you pay to publish</strong> — anything from <span data-ref="minText">Rp2.500</span> upwards.</p>

    <div class="composer__layout">
      <form class="composer__form card" data-ref="form" novalidate>
        <label class="field">
          <span class="field__label">Your note</span>
          <textarea name="body" data-ref="body" rows="5" maxlength="500" required placeholder="Write something for your campus…"></textarea>
          <span class="field__hint"><span data-ref="count">0</span>/500</span>
        </label>

        <label class="field">
          <span class="field__label">Name shown on the note</span>
          <input name="author_name" data-ref="author" maxlength="40" autocomplete="off" value="" placeholder="Leave empty to post as Anonymous">
          <span class="field__hint">Optional. Empty = “Anonymous”. Plain text only: never a link, never tied to an account. Names of registered members, links and @handles are not allowed.</span>
        </label>

        <label class="field">
          <span class="field__label">How much do you want to pay to publish? (Rp)</span>
          <span class="money-input">
            <span class="money-input__prefix" aria-hidden="true">Rp</span>
            <input name="amount" data-ref="amount" inputmode="numeric" autocomplete="off" value="2500"
                   aria-describedby="amount-hint amount-error" required>
          </span>
          <div class="presets" data-ref="presets" role="group" aria-label="Quick amounts"></div>
          <span class="field__hint" id="amount-hint" data-ref="amountHint">Digits only (dots are fine, e.g. 25.000).</span>
          <span class="field__error" id="amount-error" data-ref="amountError" role="alert"></span>
        </label>

        <fieldset class="field">
          <legend class="field__label">Note colour</legend>
          <div class="swatches" data-ref="colors">
            <label class="swatch swatch--yellow"><input type="radio" name="color" value="yellow" checked><span>Yellow</span></label>
            <label class="swatch swatch--pink"><input type="radio" name="color" value="pink"><span>Pink</span></label>
            <label class="swatch swatch--blue"><input type="radio" name="color" value="blue"><span>Blue</span></label>
            <label class="swatch swatch--green"><input type="radio" name="color" value="green"><span>Green</span></label>
            <label class="swatch swatch--orange"><input type="radio" name="color" value="orange"><span>Orange</span></label>
            <label class="swatch swatch--purple"><input type="radio" name="color" value="purple"><span>Purple</span></label>
          </div>
        </fieldset>

        <fieldset class="field decos">
          <legend class="field__label">Decorations (optional)</legend>
          <p class="muted small" data-ref="decoMsg">Loading decorations…</p>
          <div class="decos__singles" data-ref="decoSingles"></div>
          <div class="decos__stickers" data-ref="stickerBox" hidden>
            <div class="field">
              <span class="field__label">Stickers, stamps and badges</span>
              <div data-ref="adder"></div>
            </div>
            <span class="field__hint" id="sticker-add-hint" data-ref="adderHint"></span>
            <ul class="sticker-list" data-ref="stickerList" hidden></ul>
          </div>
          <p class="visually-hidden" role="status" data-ref="decoLive"></p>
        </fieldset>

        <fieldset class="field poll-builder">
          <legend class="field__label">Poll or quiz (optional)</legend>
          <select name="poll_kind" data-ref="pollKind" aria-label="Poll or quiz">
            <option value="none">No poll</option>
            <option value="poll">Poll (no right answer)</option>
            <option value="quiz">Quiz (one or more right answers)</option>
          </select>
          <div class="stack" data-ref="pollBox" hidden>
            <span class="field__hint">Your note text above is the question. Members sign in to answer, once each.</span>
            <label class="check">
              <input type="checkbox" data-ref="pollMulti">
              <span>Allow choosing more than one answer</span>
            </label>
            <ol class="poll-builder__rows" data-ref="pollRows"></ol>
            <button type="button" class="btn btn--small" data-ref="pollAdd">Add option</button>
          </div>
        </fieldset>

        <label class="field">
          <span class="field__label">Spotify link (optional)</span>
          <input name="spotify" data-ref="spotify" type="url" inputmode="url" autocomplete="off" placeholder="https://open.spotify.com/track/…">
          <span class="field__hint">A song, album, playlist, podcast episode or show from open.spotify.com. Press Share, then Copy link, in Spotify.</span>
        </label>

        <label class="field">
          <span class="field__label">Social link (optional)</span>
          <input name="social_link" data-ref="social" type="url" inputmode="url" placeholder="https://instagram.com/yourname">
          <span class="field__hint">Instagram, X, TikTok, LinkedIn, GitHub, YouTube, Facebook or Threads.</span>
        </label>

        <label class="field">
          <span class="field__label">Photos, GIFs or videos (optional)</span>
          <input type="file" data-ref="media" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm">
          <div class="file-previews" data-ref="mediaPreview" aria-live="polite"></div>
          <span class="field__hint" data-ref="mediaHint">Up to 4 files, 25 MB each. Photos are re-saved without camera data such as GPS. Videos are only scrubbed of embedded GPS coordinates, so check them yourself. Files are public once your note is published.</span>
        </label>

        <div class="field" data-ref="campusField"></div>

        <fieldset class="field" data-ref="discountRow" hidden>
          <legend class="field__label">Free post and promo code</legend>
          <label class="check" data-ref="freeRow" hidden>
            <input type="checkbox" name="use_free_post" data-ref="useFree">
            <span><strong>1 free post available</strong> this week (resets Monday 00:00 WIB). Covers the minimum price.</span>
          </label>
          <div class="row row--tight">
            <input data-ref="promo" maxlength="24" autocomplete="off" autocapitalize="characters" placeholder="Promo code" aria-label="Promo code">
            <button type="button" class="btn btn--small" data-ref="applyPromo">Apply</button>
          </div>
          <span class="field__hint">Discounts apply to the minimum price only. Anything paid above it is a tip and is never discounted.</span>
          <p class="small" data-ref="promoMsg" aria-live="polite"></p>
        </fieldset>

        <label class="check" data-ref="creditRow" hidden>
          <input type="checkbox" name="use_credit" data-ref="useCredit">
          <span>Use one free-publication credit (−Rp5.000) · <span data-ref="creditCount">0</span> available</span>
        </label>

        <fieldset class="field" data-ref="refRow" hidden>
          <legend>Referral credits</legend>
          <label class="check">
            <input type="checkbox" name="use_ref_credits" data-ref="useRefCredits">
            <span>Pay with my referral credits <span class="muted">(optional)</span> · <strong data-ref="postLeft">0</strong> free posts and <strong data-ref="decoLeft">0</strong> free decorations left</span>
          </label>
          <div class="stack" data-ref="refOptions" hidden>
            <label class="check">
              <input type="checkbox" name="use_post_credit" data-ref="usePostCredit">
              <span>Use a free post credit (the post itself is free)</span>
            </label>
            <label class="field">
              <span class="field__label">Free decorations to use</span>
              <input type="number" name="deco_credits" min="0" step="1" value="0" inputmode="numeric" data-ref="decoCredits">
              <span class="small muted">Applied to your most expensive paid decorations first. Free decorations never use a credit. Anything not covered is paid normally.</span>
            </label>
            <p class="small" data-ref="refSummary" aria-live="polite"></p>
          </div>
        </fieldset>

        <p class="field__error" data-ref="formError" role="alert"></p>
      </form>

      <aside class="composer__side">
        <div class="preview-wrap" data-ref="preview"></div>
        <p class="small muted sticker-hint" data-ref="stickerHint" hidden>Drag a sticker on the preview to place it. Hover or tap it for the ↻ rotate and ✕ remove buttons, or focus it and use the arrow keys to move (Shift moves further), R to rotate, Delete to remove.</p>
        <div class="card summary" aria-live="polite">
          <h2 class="summary__title">Order summary</h2>
          <dl class="summary__list">
            <div><dt>Your publication price</dt><dd data-ref="sumAmount">Rp2.500</dd></div>
            <div><dt>Decorations</dt><dd data-ref="sumDecos">Rp0</dd></div>
            <div data-ref="sumPromoRow" hidden><dt data-ref="sumPromoLabel">Promo</dt><dd data-ref="sumPromo">−Rp0</dd></div>
            <div data-ref="sumCreditRow" hidden><dt>Credits</dt><dd data-ref="sumCredit">−Rp0</dd></div>
            <div class="summary__total"><dt>Total due</dt><dd data-ref="sumTotal">Rp2.500</dd></div>
          </dl>
          <p class="muted small">Final amounts are calculated by our server before payment.</p>
          <details class="small privacy-note">
            <summary>What we can and can’t see</summary>
            <p><strong>Public:</strong> your note, the name you typed (or “Anonymous”), decorations.</p>
            <p><strong>We don’t keep:</strong> any link between your account and a published note. Payment, free-post and promo records hold no note text or note id. Free-post and promo records only keep the hour, not the minute.</p>
            <p><strong>Still visible:</strong> Midtrans sees who paid and when (we can’t hide that); if you choose a social link it is public; at the moment you post, the time of your payment and the time your note appears are close together.</p>
          </details>
          <label class="check" data-ref="confirmRow" hidden>
            <input type="checkbox" data-ref="confirm">
            <span>I confirm I want to pay <strong data-ref="confirmAmount">Rp2.500</strong> for this note.</span>
          </label>
          <button type="button" class="btn btn--primary btn--block" data-ref="submit">Continue to payment</button>
        </div>
      </aside>
    </div>
  </section>
</template>
