<!-- Account-only leaderboards. -->
<template id="tpl-leaderboard">
  <section class="leaderboard-view">
    <h1 class="page-title">Leaderboards</h1>
    <div class="tabs" role="tablist" data-ref="tabs">
      <button type="button" role="tab" class="tab" data-kind="referrals" aria-selected="true">Most referrals</button>
      <button type="button" role="tab" class="tab" data-kind="donations" aria-selected="false">Top donors</button>
      <button type="button" role="tab" class="tab" data-kind="notes" aria-selected="false">Most notes</button>
    </div>
    <div class="period" role="group" aria-label="Period">
      <label class="check"><input type="radio" name="period" value="all" checked> All time</label>
      <label class="check"><input type="radio" name="period" value="week"> This week</label>
    </div>
    <div class="card">
      <p class="small muted" data-ref="explain"></p>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th scope="col">#</th><th scope="col">Name</th><th scope="col" data-ref="valueHeader">Count</th></tr></thead>
          <tbody data-ref="rows"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</template>
