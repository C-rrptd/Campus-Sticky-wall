<!-- Sign in, register, password reset. -->
<template id="tpl-auth">
  <section class="auth-view">
    <div class="card auth-card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" data-ref="tabLogin" data-mode="login" aria-selected="true">Sign in</button>
        <button type="button" role="tab" class="tab" data-ref="tabRegister" data-mode="register" aria-selected="false">Create account</button>
      </div>

      <form class="stack" data-ref="login" novalidate>
        <h1 class="page-title page-title--small">Welcome back</h1>
        <label class="field"><span class="field__label">Email</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="field"><span class="field__label">Password</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn--primary" type="submit">Sign in</button>
        <button class="link-button" type="button" data-ref="forgot">Forgot your password?</button>
      </form>

      <form class="stack" data-ref="register" novalidate hidden>
        <h1 class="page-title page-title--small">Create your account</h1>
        <p class="muted small">Accounts can vote, bookmark and earn referral credits. Posting a note never requires an account.</p>
        <label class="field"><span class="field__label">Display name</span><input name="display_name" maxlength="40" minlength="2" required autocomplete="nickname"></label>
        <label class="field"><span class="field__label">Email</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="field"><span class="field__label">Password (min. 10 characters)</span><input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <label class="field"><span class="field__label">Referral code (optional)</span><input name="referral_code" maxlength="8" data-ref="refCode" autocapitalize="characters" placeholder="ABCD2345"></label>
        <button class="btn btn--primary" type="submit">Create account</button>
      </form>

      <form class="stack" data-ref="forgotForm" novalidate hidden>
        <h1 class="page-title page-title--small">Reset your password</h1>
        <label class="field"><span class="field__label">Email</span><input name="email" type="email" autocomplete="email" required></label>
        <button class="btn btn--primary" type="submit">Send reset link</button>
        <button class="link-button" type="button" data-ref="backToLogin">Back to sign in</button>
      </form>

      <form class="stack" data-ref="updateForm" novalidate hidden>
        <h1 class="page-title page-title--small">Choose a new password</h1>
        <label class="field"><span class="field__label">New password (min. 10 characters)</span><input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="btn btn--primary" type="submit">Save new password</button>
      </form>

      <div class="notice" data-ref="notice" role="status" hidden></div>
      <p class="field__error" data-ref="error" role="alert"></p>
    </div>
  </section>
</template>
