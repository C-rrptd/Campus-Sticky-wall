<!-- Administrator console. This markup grants nothing: every action is authorized server-side. -->
<template id="tpl-admin">
  <section class="admin-view">
    <h1 class="page-title">Administration</h1>
    <div class="admin-layout">
    <nav class="admin-tabs" role="tablist" aria-orientation="vertical" aria-label="Administration sections" data-ref="tabs">
      <button type="button" role="tab" class="admin-tab" data-tab="overview" aria-selected="true">Overview</button>
      <button type="button" role="tab" class="admin-tab" data-tab="moderation" aria-selected="false">Moderation</button>
      <button type="button" role="tab" class="admin-tab" data-tab="reports" aria-selected="false">Reports</button>
      <button type="button" role="tab" class="admin-tab" data-tab="users" aria-selected="false">Users</button>
      <button type="button" role="tab" class="admin-tab" data-tab="orders" aria-selected="false">Payments</button>
      <button type="button" role="tab" class="admin-tab" data-tab="campaigns" aria-selected="false">Campaigns</button>
      <button type="button" role="tab" class="admin-tab" data-tab="catalog" aria-selected="false">Prices &amp; settings</button>
      <button type="button" role="tab" class="admin-tab" data-tab="adinsights" aria-selected="false">Ad insights</button>
      <button type="button" role="tab" class="admin-tab" data-tab="slots" aria-selected="false">Slots &amp; utilization</button>
      <button type="button" role="tab" class="admin-tab" data-tab="auctions" aria-selected="false">Auctions</button>
      <button type="button" role="tab" class="admin-tab" data-tab="locations" aria-selected="false">Locations</button>
      <button type="button" role="tab" class="admin-tab" data-tab="announcements" aria-selected="false">News</button>
      <button type="button" role="tab" class="admin-tab" data-tab="promos" aria-selected="false">Promos</button>
      <button type="button" role="tab" class="admin-tab" data-tab="referrals" aria-selected="false">Referrals</button>
      <button type="button" role="tab" class="admin-tab" data-tab="revenue" aria-selected="false">Revenue</button>
      <button type="button" role="tab" class="admin-tab" data-tab="audit" aria-selected="false">Audit log</button>
      <button type="button" role="tab" class="admin-tab" data-tab="security" aria-selected="false" data-owner-only>Security log</button>
    </nav>
    <div class="admin-panel" data-ref="panel" aria-live="polite"></div>
    </div>
  </section>
</template>
