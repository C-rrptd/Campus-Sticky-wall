<!-- Settings: skin, theme, language. Works signed in or out. -->
<template id="tpl-settings">
  <section class="settings-view">
    <h1 class="page-title">Settings</h1>
    <div class="panel narrow">
      <fieldset class="setting">
        <legend class="field__label">Skin</legend>
        <div class="seg" role="group" aria-label="Skin" data-ref="skin">
          <button type="button" data-value="paper" aria-pressed="false">Classic</button>
          <button type="button" data-value="neo" aria-pressed="false">Neo</button>
        </div>
      </fieldset>
      <fieldset class="setting">
        <legend class="field__label">Theme</legend>
        <div class="seg" role="group" aria-label="Theme" data-ref="theme">
          <button type="button" data-value="light" aria-pressed="false">Light</button>
          <button type="button" data-value="dark" aria-pressed="false">Dark</button>
        </div>
      </fieldset>
      <fieldset class="setting">
        <legend class="field__label">Language</legend>
        <div class="seg" role="group" aria-label="Language" data-ref="language">
          <button type="button" data-value="en" aria-pressed="false">English</button>
          <button type="button" data-value="id" aria-pressed="false">Bahasa Indonesia</button>
        </div>
      </fieldset>
    </div>
  </section>
</template>
