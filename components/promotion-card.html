<!-- One sponsored listing. Paid placements are always labelled. -->
<template id="tpl-promotion-card">
  <article class="promo" data-ref="root">
    <span class="badge badge--sponsored">Sponsored</span>
    <img class="promo__image" data-ref="image" alt="" loading="lazy" hidden>
    <div class="promo__content">
      <p class="promo__category" data-ref="category"></p>
      <h3 class="promo__title" data-ref="title"></h3>
      <p class="promo__desc" data-ref="description"></p>
      <p class="promo__meta"><span data-ref="advertiser"></span> · <span data-ref="ends"></span></p>
      <a class="btn btn--small" data-ref="link" target="_blank" rel="noopener noreferrer sponsored">Learn more ↗</a>
    </div>
  </article>
</template>
