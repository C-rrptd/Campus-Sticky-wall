<!-- Promotions feed and the advertiser campaign form. -->
<template id="tpl-promotions">
  <section class="promotions-view">
    <div class="wall-toolbar">
      <div>
        <h1 class="page-title">Promotions</h1>
        <p class="page-lead">Student discounts, campus events, workshops and opportunities near you. All listings are paid placements.</p>
      </div>
      <details class="dropdown">
        <summary class="dropdown__tab">Filter</summary>
        <div class="dropdown__panel">
        <label class="field">
          <span class="field__label">Category</span>
          <select data-ref="category">
            <option value="">All</option>
            <option value="student_discount">Student discounts</option>
            <option value="local_business">Local businesses</option>
            <option value="campus_event">Campus events</option>
            <option value="workshop">Workshops</option>
            <option value="competition">Competitions</option>
            <option value="recruitment">Internships &amp; jobs</option>
            <option value="student_service">Student services</option>
            <option value="club_event">Clubs &amp; organisations</option>
            <option value="other">Other</option>
          </select>
        </label>
        <div data-ref="location"></div>
        </div>
      </details>
    </div>
    <div class="stack" data-ref="featured"></div>
    <div class="promo-grid" data-ref="grid" aria-live="polite" aria-busy="true"></div>
    <p class="wall-empty" data-ref="empty" hidden>No promotions for this area yet. Try a wider area — or <a href="#/advertise">promote something here</a>.</p>
    <p class="wall-error" data-ref="error" role="alert" hidden></p>
    <aside class="card cta">
      <h2>Reach students on your campus</h2>
      <p>Book a placement for one campus, a city, a province or the whole country. Fixed prices, clear durations, reviewed before going live.</p>
      <a class="btn btn--primary" href="#/advertise">Advertise with us</a>
    </aside>
  </section>
</template>
