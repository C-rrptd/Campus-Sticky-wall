<!-- The public sticky-note wall. -->
<template id="tpl-wall">
  <section class="wall-view">
    <div data-ref="pinned"></div>
    <div class="stack" data-ref="featured"></div>
    <section data-ref="topBox" hidden>
      <h2>Top notes</h2>
      <div class="wall" data-ref="top"></div>
    </section>
    <div class="wall-toolbar">
      <div>
        <h1 class="page-title" data-ref="title">The Wall</h1>
        <p class="page-lead" data-ref="lead">Notes from students, pinned by students. Anyone can post — you choose what you pay (from Rp2.500).</p>
        <a class="small" data-ref="campusLink" hidden>Open this campus’s page →</a>
      </div>
      <input type="search" class="wall-search" data-ref="q" maxlength="60" placeholder="Search notes…" aria-label="Search notes" autocomplete="off">
      <details class="dropdown">
        <summary class="dropdown__tab">Filter &amp; sort</summary>
        <div class="dropdown__panel">
          <label class="field">
            <span class="field__label">Sort</span>
            <select data-ref="sort">
              <option value="newest">Newest</option>
              <option value="top">Most voted</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">Colour</span>
            <select data-ref="color">
              <option value="">All colours</option>
              <option value="yellow">Yellow</option>
              <option value="pink">Pink</option>
              <option value="blue">Blue</option>
              <option value="green">Green</option>
              <option value="orange">Orange</option>
              <option value="purple">Purple</option>
            </select>
          </label>
          <div data-ref="location"></div>
        </div>
      </details>
    </div>
    <div class="wall" data-ref="grid" aria-live="polite" aria-busy="true"></div>
    <p class="wall-empty" data-ref="empty" hidden>No notes here yet. <a href="#/compose">Be the first to post one!</a></p>
    <p class="wall-error" data-ref="error" role="alert" hidden></p>
    <div class="wall-more"><button type="button" class="btn" data-ref="more" hidden>Load more notes</button></div>
  </section>
</template>
